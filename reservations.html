<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservations</title>
  </head>
  <body>
    <link rel="stylesheet" href="styles.css" />
    <header class="page-header">
      <div class="new">
        <img src="images/logo.png" alt="logo" />
        <h1 class="title">Sushi World</h1>
      </div>
      <div class="links">
        <a href="index.html" class="home-link">Home Page</a>
      </div>
    </header>
    <h1>Make a Reservation</h1>
    <img class="reserv-img" src="images/a.jpg" alt="Reservations Image" />
    <section class="resv-info">
      <h2>Reserve Your Table Today!</h2>
      <p>
        Enjoy an unforgettable dining experience at Sushi World. Reserve your
        table now to savor our exquisite sushi and Japanese cuisine in a
        welcoming atmosphere.
      </p>
      <input type="text" class="resv-input" placeholder="Enter your name" />
      <input type="date" class="resv-input" />
      <input type="time" class="resv-input" />
      <button class="resv-button">Reserve Now</button>
    </section>
    <footer class="page-footer">
      <p>&copy; 2026 Sushi World. All rights reserved.</p>
    </footer>
  </body>
</html>
